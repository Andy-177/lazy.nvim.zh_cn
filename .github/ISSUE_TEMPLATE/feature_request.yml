name: Feature Request
description: 建议一个新功能
title: "feature: "
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: 你检查过文档了吗？
      description: 在提交功能请求之前，请确保你已阅读全部文档
      options:
        - label: 我已阅读 lazy.nvim 的全部文档
          required: true
  - type: textarea
    validations:
      required: true
    attributes:
      label: 你的功能请求与某个问题相关吗？请描述一下。
      description: 清晰、简洁地描述这个问题是什么。例如：我总是遇到 [...] 时感到挫败。
  - type: textarea
    validations:
      required: true
    attributes:
      label: 描述你想要的解决方案
      description: 清晰、简洁地描述你希望发生什么。
  - type: textarea
    validations:
      required: true
    attributes:
      label: 描述你考虑过的其他方案
      description: 清晰、简洁地描述你考虑过的任何替代方案或功能。
  - type: textarea
    validations:
      required: false
    attributes:
      label: 补充说明
      description: 在这里补充与该功能请求有关的其他信息或截图。
